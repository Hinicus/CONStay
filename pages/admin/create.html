<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create News - CONStay</title>
    <link rel="stylesheet" href="/global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/tailwind-config.js"></script>

    <!-- Quill Rich Text Editor -->
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet" />
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  </head>
  <body class="min-h-screen bg-surface flex flex-col items-center py-10 px-4">
    <div
      class="max-w-3xl w-full bg-white p-8 rounded-2xl shadow-sm border border-surface-dim">
      <h1 class="text-3xl font-serif font-bold text-primary mb-6">
        Publish New Article
      </h1>

      <form id="create-news-form" class="flex flex-col gap-6">
        <!-- Temporary hardcoded Author ID for testing -->
        <input type="hidden" id="authorId" value="admin_user_123" />

        <div>
          <label class="block text-sm font-bold text-primary mb-2"
            >Headline</label
          >
          <input
            type="text"
            id="title"
            required
            class="w-full p-3 border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none"
            placeholder="Enter article headline" />
        </div>

        <div>
          <label class="block text-sm font-bold text-primary mb-2"
            >Short Snippet</label
          >
          <textarea
            id="snippet"
            required
            class="w-full p-3 border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none"
            rows="2"
            placeholder="Brief summary for the dashboard card"></textarea>
        </div>

        <!-- Content Inputs -->
        <div>
          <label class="block text-sm font-bold text-primary mb-2"
            >Full Content</label
          >
          <!-- Quill will inject its toolbar and editor into this container -->
          <div class="bg-white">
            <div id="editor-container" style="height: 300px"></div>
          </div>
        </div>

        <div
          class="p-4 bg-surface-container-low rounded-lg border border-surface-dim">
          <h3 class="text-sm font-bold text-primary mb-4">Image Details</h3>
          <div class="flex flex-col gap-4">
            <input
              type="url"
              id="imageUrl"
              class="w-full p-3 border border-outline-variant rounded-lg"
              placeholder="Image URL (e.g., https://images.com/photo.jpg)" />
            <div class="flex gap-4">
              <input
                type="text"
                id="imageCaption"
                class="w-full p-3 border border-outline-variant rounded-lg"
                placeholder="Optional Caption" />
              <input
                type="text"
                id="imageCredit"
                class="w-full p-3 border border-outline-variant rounded-lg"
                placeholder="Optional Credit (e.g., John Doe)" />
            </div>
          </div>
        </div>

        <button
          type="submit"
          class="bg-primary hover:bg-secondary text-white font-bold py-3 px-6 rounded-lg transition-colors mt-4">
          Publish Article
        </button>

        <div
          id="form-message"
          class="hidden mt-4 p-4 rounded-lg text-sm font-bold"></div>
      </form>
    </div>
    <script src="/pages/admin/create.js"></script>
  </body>
</html>
