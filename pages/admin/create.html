<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Create Dispatch - CONStay</title>

    <!-- 1. Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com?"></script>
    <script src="/tailwind-config.js"></script>
    <link href="/global.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet" />

    <!-- 2. Quill.js Rich Text Editor -->
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet" />
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  </head>
  <body
    class="min-h-screen bg-surface flex flex-col antialiased selection:bg-clear-skies selection:text-deep-ocean">
    <!-- Header Injected Here -->
    <div class="font-body-md" id="header-placeholder"></div>

    <!-- MAIN FORM WRAPPER -->
    <main class="flex-grow flex flex-col items-center py-10 px-4 sm:px-6">
      <div
        class="max-w-3xl w-full bg-surface-container-lowest p-6 sm:p-10 rounded-2xl shadow-sm border border-surface-dim">
        <div class="mb-8">
          <span
            class="text-xs font-bold uppercase tracking-widest text-[#438bc4] mb-2 block"
            >Admin Portal</span
          >
          <h1 class="text-3xl sm:text-4xl font-serif font-bold text-primary">
            Publish New Article
          </h1>
        </div>

        <form id="create-news-form" class="flex flex-col gap-6">
          <!-- Headline -->
          <div>
            <label class="block font-title-sm text-title-sm text-primary mb-2"
              >Headline</label
            >
            <input
              type="text"
              id="title"
              required
              class="w-full p-3 border border-outline-variant rounded-lg bg-surface-bright focus:ring-2 focus:ring-secondary focus:outline-none font-body-md"
              placeholder="Enter article headline" />
          </div>

          <!-- Snippet -->
          <div>
            <div class="flex justify-between items-end mb-2">
              <label class="block font-title-sm text-title-sm text-primary"
                >Short Snippet</label
              >
              <!-- Live character counter -->
              <span
                id="snippet-counter"
                class="text-xs font-bold text-on-surface-variant"
                >0 / 150</span
              >
            </div>
            <!-- Added maxlength="150" -->
            <textarea
              id="snippet"
              required
              maxlength="150"
              class="w-full p-3 border border-outline-variant rounded-lg bg-surface-bright focus:ring-2 focus:ring-secondary focus:outline-none font-body-md"
              rows="2"
              placeholder="Brief summary for the dashboard card"></textarea>
          </div>

          <!-- Quill Rich Text Editor -->
          <div>
            <label class="block font-title-sm text-title-sm text-primary mb-2"
              >Full Content</label
            >
            <div
              class="bg-surface-bright rounded-lg overflow-hidden border border-outline-variant">
              <!-- The toolbar and editor attach to this div -->
              <div
                id="editor-container"
                style="
                  height: 350px;
                  font-family: &quot;Newsreader&quot;, serif;
                  font-size: 1.125rem;
                "></div>
            </div>
          </div>

          <!-- Image Upload Section (Updated with Toggle) -->
          <div
            class="p-6 bg-surface-container-low rounded-xl border border-surface-dim mt-2">
            <h3
              class="font-title-sm text-title-sm text-primary mb-4 flex items-center gap-2">
              <span class="material-symbols-outlined text-xl">image</span>
              Featured Image Details
            </h3>

            <div class="flex flex-col gap-5">
              <!-- Toggle Buttons -->
              <div class="flex items-center gap-6">
                <!-- No Image Option -->
                <label
                  class="flex items-center gap-2 text-sm font-bold cursor-pointer">
                  <input
                    type="radio"
                    name="imageMode"
                    value="none"
                    class="w-4 h-4 text-secondary focus:ring-secondary border-outline-variant" />
                  <span>No Image</span>
                </label>
                <label
                  class="flex items-center gap-2 text-sm font-bold cursor-pointer">
                  <input
                    type="radio"
                    name="imageMode"
                    value="upload"
                    checked
                    class="w-4 h-4 text-secondary focus:ring-secondary border-outline-variant" />
                  <span>Upload File</span>
                </label>
                <label
                  class="flex items-center gap-2 text-sm font-bold cursor-pointer">
                  <input
                    type="radio"
                    name="imageMode"
                    value="link"
                    class="w-4 h-4 text-secondary focus:ring-secondary border-outline-variant" />
                  <span>Paste Web Link</span>
                </label>
              </div>

              <!-- File Input (Visible by default) -->
              <div id="upload-container">
                <input
                  type="file"
                  id="imageFile"
                  accept="image/*"
                  class="w-full p-2 border border-outline-variant rounded-lg bg-surface-bright cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-secondary-fixed file:text-on-secondary-fixed hover:file:bg-[#b3c7f2] transition-all" />
                <p class="text-xs text-on-surface-variant mt-1.5">
                  Supported formats: JPG, PNG, WEBP (Max size: 5MB)
                </p>
              </div>

              <!-- URL Input (Hidden by default) -->
              <div id="link-container" class="hidden">
                <input
                  type="url"
                  id="imageUrl"
                  class="w-full p-3 border border-outline-variant rounded-lg bg-surface-bright font-body-sm"
                  placeholder="https://example.com/image.jpg" />
              </div>

              <!-- ADD THIS BLOCK BACK -->
              <div
                id="image-meta-container"
                class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                <div>
                  <label
                    class="block font-label-sm text-label-sm text-on-surface-variant mb-1"
                    >Image Caption (Optional)</label
                  >
                  <input
                    type="text"
                    id="imageCaption"
                    class="w-full p-3 border border-outline-variant rounded-lg bg-surface-bright font-body-sm focus:ring-2 focus:ring-secondary focus:outline-none"
                    placeholder="e.g., Nursing students evaluating..." />
                </div>
                <div>
                  <label
                    class="block font-label-sm text-label-sm text-on-surface-variant mb-1"
                    >Image Credit (Optional)</label
                  >
                  <input
                    type="text"
                    id="imageCredit"
                    class="w-full p-3 border border-outline-variant rounded-lg bg-surface-bright font-body-sm focus:ring-2 focus:ring-secondary focus:outline-none"
                    placeholder="e.g., Clinical Archives" />
                </div>
              </div>
              <!-- END ADD BLOCK -->

              <!-- Publication Status Toggle -->
              <div class="pt-4 border-t border-surface-dim mt-2">
                <label
                  class="block font-title-sm text-title-sm text-primary mb-3">
                  Publication Status
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <label
                    class="flex items-center gap-3 p-3.5 rounded-xl border border-outline-variant bg-surface-bright cursor-pointer hover:border-secondary transition-colors has-[:checked]:border-secondary has-[:checked]:bg-secondary-fixed/30">
                    <input
                      type="radio"
                      name="articleStatus"
                      value="published"
                      checked
                      class="w-4 h-4 text-secondary focus:ring-secondary" />
                    <div>
                      <span class="block text-sm font-bold text-primary"
                        >Publish Immediately</span
                      >
                      <span class="block text-xs text-on-surface-variant"
                        >Visible on the public homepage</span
                      >
                    </div>
                  </label>

                  <label
                    class="flex items-center gap-3 p-3.5 rounded-xl border border-outline-variant bg-surface-bright cursor-pointer hover:border-secondary transition-colors has-[:checked]:border-secondary has-[:checked]:bg-secondary-fixed/30">
                    <input
                      type="radio"
                      name="articleStatus"
                      value="draft"
                      class="w-4 h-4 text-secondary focus:ring-secondary" />
                    <div>
                      <span class="block text-sm font-bold text-primary"
                        >Save as Draft</span
                      >
                      <span class="block text-xs text-on-surface-variant"
                        >Hidden until you publish later</span
                      >
                    </div>
                  </label>
                </div>
              </div>

              <!-- Submit Button -->
              <button
                type="submit"
                id="submit-btn"
                class="bg-secondary hover:bg-primary text-white font-bold py-3.5 px-6 rounded-xl transition-colors mt-4 flex items-center justify-center gap-2 shadow-md">
                <span id="submit-btn-text">Publish Article</span>
                <span
                  id="submit-btn-icon"
                  class="material-symbols-outlined text-sm"
                  >publish</span
                >
              </button>

              <!-- Success/Error Message Container -->
              <div
                id="form-message"
                class="hidden mt-2 p-4 rounded-lg font-title-sm text-center"></div>
            </div>
          </div>
        </form>
      </div>
    </main>

    <!-- Footer Injected Here -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/components.js"></script>
    <script type="module" src="/pages/admin/create.js"></script>
    <script type="module" src="/pages/admin/auth-guard.js"></script>
  </body>
</html>
