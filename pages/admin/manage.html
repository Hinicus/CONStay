<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Articles - CONStay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/tailwind-config.js"></script>
    <link href="/global.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet" />
  </head>
  <body
    class="min-h-screen bg-surface flex flex-col antialiased selection:bg-clear-skies selection:text-deep-ocean">
    <div id="header-placeholder"></div>

    <main class="flex-grow flex flex-col items-center py-10 px-4 sm:px-6">
      <div
        class="max-w-4xl w-full bg-surface-container-lowest p-6 sm:p-10 rounded-2xl shadow-sm border border-surface-dim">
        <div class="flex items-center justify-between mb-8">
          <div>
            <span
              class="text-xs font-bold uppercase tracking-widest text-[#438bc4] mb-2 block"
              >Admin Portal</span
            >
            <h1 class="text-3xl font-serif font-bold text-primary">
              Manage Articles
            </h1>
          </div>
          <a
            href="/pages/admin/create.html"
            class="bg-secondary hover:bg-primary text-white text-sm font-bold py-2.5 px-4 rounded-xl transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined text-sm">add</span> New
          </a>
        </div>

        <!-- JavaScript will inject the list of articles here -->
        <div id="articles-list" class="flex flex-col gap-4">
          <p class="text-on-surface-variant text-sm font-bold">
            Loading articles...
          </p>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/components.js"></script>
    <script src="/pages/admin/manage.js"></script>
  </body>
</html>
