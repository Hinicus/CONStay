<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - TatakCON</title>

    <link href="/global.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet" />

    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
  </head>
  <body class="min-h-screen bg-surface flex items-center justify-center p-4">
    <div
      class="max-w-md w-full bg-surface-container-lowest p-8 rounded-2xl shadow-sm border border-surface-dim">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-serif font-bold text-primary mb-2">
          TatakCON
        </h1>
        <p
          class="text-sm font-bold text-on-surface-variant uppercase tracking-widest">
          Admin Portal
        </p>
      </div>

      <form id="login-form" class="flex flex-col gap-5">
        <!-- Email -->
        <div>
          <label
            class="block font-label-sm text-label-sm text-on-surface-variant mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="email"
            required
            class="w-full p-3 border border-outline-variant rounded-lg bg-surface-bright focus:ring-2 focus:ring-secondary focus:outline-none"
            placeholder="example@gmail.com  " />
        </div>

        <!-- Password -->
        <div>
          <label
            class="block font-label-sm text-label-sm text-on-surface-variant mb-1"
            >Password</label
          >

          <div class="relative flex items-center">
            <!-- Added pr-12 to prevent text overlapping the button -->
            <input
              type="password"
              id="password"
              required
              class="w-full p-3 pr-12 border border-outline-variant rounded-lg bg-surface-bright focus:ring-2 focus:ring-secondary focus:outline-none"
              placeholder="••••••••" />

            <!-- Toggle Button -->
            <button
              type="button"
              id="toggle-password"
              class="absolute right-2 p-2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none flex items-center justify-center rounded-full hover:bg-surface-dim">
              <span
                id="toggle-icon"
                class="material-symbols-outlined text-[20px]"
                >visibility</span
              >
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="bg-secondary hover:bg-primary text-white font-bold py-3 px-4 rounded-xl transition-colors mt-2">
          Sign In
        </button>

        <!-- Divider -->
        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-outline-variant/60"></div>
          <span
            class="flex-shrink mx-3 text-xs font-bold uppercase tracking-wider text-on-surface-variant"
            >Or</span
          >
          <div class="flex-grow border-t border-outline-variant/60"></div>
        </div>

        <!-- Google OAuth Button -->
        <button
          type="button"
          id="google-auth-btn"
          class="w-full bg-surface-bright hover:bg-surface-dim text-primary font-bold py-3 px-4 rounded-xl border border-outline-variant transition-colors flex items-center justify-center gap-3 shadow-sm">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          <span>Continue with Google</span>
        </button>

        <div class="text-center mt-2">
          <p class="text-sm text-on-surface-variant">
            Are you an author?
            <a
              href="/pages/admin/signup.html"
              class="text-secondary font-bold hover:underline"
              >Apply here</a
            >
          </p>
          <button
            type="button"
            id="forgot-password-btn"
            class="text-xs font-bold text-secondary hover:text-primary transition-colors">
            Forgot Password?
          </button>

          <p class="text-xs text-on-surface-variant mt-1">
            <a
              href="/index.html"
              class="text-secondary font-bold hover:underline"
              >Back to Home</a
            >
          </p>
        </div>

        <div
          id="login-message"
          class="hidden mt-2 p-3 rounded-lg text-sm font-bold text-center"></div>
      </form>
    </div>

    <!-- IMPORTANT: type="module" is required to use import/export -->
    <script type="module" src="/pages/admin/login.js"></script>
  </body>
</html>
